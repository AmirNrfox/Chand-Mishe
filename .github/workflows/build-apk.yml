name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🏗️ Build APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛠️ Expo Prebuild
        run: npx expo prebuild --platform android --no-install

      - name: 🏗️ Build Android APKs (Split by Architecture)
        run: |
          cd android
          chmod +x gradlew
          mkdir -p ../build-output

          echo "::group::Building arm64-v8a APK"
          ./gradlew assembleRelease --no-daemon \
            -Pexpo.useLegacyPackaging=true \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true
          cp app/build/outputs/apk/release/app-release.apk ../build-output/Chand-Mishe-v1.0.0-arm64-v8a.apk
          echo "::endgroup::"

          echo "::group::Building armeabi-v7a APK"
          ./gradlew assembleRelease --no-daemon \
            -Pexpo.useLegacyPackaging=true \
            -PreactNativeArchitectures=armeabi-v7a \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true
          cp app/build/outputs/apk/release/app-release.apk ../build-output/Chand-Mishe-v1.0.0-armeabi-v7a.apk
          echo "::endgroup::"

          echo "::group::Building Universal APK"
          ./gradlew assembleRelease --no-daemon \
            -Pexpo.useLegacyPackaging=true \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true
          cp app/build/outputs/apk/release/app-release.apk ../build-output/Chand-Mishe-v1.0.0-universal.apk
          echo "::endgroup::"

          ls -lh ../build-output/

      - name: 📤 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Chand-Mishe-v1.0.0-APKs
          path: build-output/*.apk
          retention-days: 30

      - name: 🚀 Publish APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          generate_release_notes: true
          draft: false
          prerelease: false
